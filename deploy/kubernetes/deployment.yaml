apiVersion: apps/v1
kind: Deployment
metadata:
  name: ricxapp-iqos-xapp-rdl
  namespace: ricxapp
  labels:
    app: ricxapp-iqos-xapp-rdl
    app.kubernetes.io/name: iqos-xapp-rdl
    app.kubernetes.io/instance: rdl-f1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ricxapp-iqos-xapp-rdl
  template:
    metadata:
      labels:
        app: ricxapp-iqos-xapp-rdl
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 15
      containers:
      - name: iqos-xapp-rdl
        image: iqos-xapp-rdl:1.1.0
        imagePullPolicy: Never
        env:
        - name: USE_FAKE_SDL
          value: "true"
        - name: RMR_SEED_RT
          value: "/app/configs/routes.rt"
        - name: CONFIG_FILE
          value: "/app/configs/config-file.json"
        - name: RMR_WAIT_FOR_READY
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        ports:
        - containerPort: 4560
          name: rmr-data
          protocol: TCP
        - containerPort: 4561
          name: rmr-route
          protocol: TCP
        - containerPort: 8080
          name: http-health
          protocol: TCP
        - containerPort: 8081
          name: http-metrics
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
