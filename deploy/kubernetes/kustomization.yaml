apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # 1. Namespaces
  - namespace.yaml

  # 2. Near-RT RIC Platform (ricplt: Redis DBAAS, E2Term, SubMgr)
