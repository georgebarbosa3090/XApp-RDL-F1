apiVersion: v1
kind: ConfigMap
metadata:
  name: iqos-xapp-rdl-config
  namespace: ricxapp
  labels:
    app.kubernetes.io/name: iqos-xapp-rdl
    app.kubernetes.io/part-of: openran-br-blueprint-v3
data:
  config-file.json: |
    {
      "xapp_name": "iqos-xapp-rdl",
      "version": "1.1.0",
      "mode": "O_RAN_INTEROP",
      "rmr": {
        "protPort": "tcp:4560",
        "numWorkers": 2,
        "maxSize": 65536
      },
      "e2": {
        "e2mgr_url": "http://service-ricplt-e2mgr-http.ricplt:3800",
        "submgr_url": "http://service-ricplt-submgr-http.ricplt:8088",
        "kpm_interval_ms": 200,
        "kpm_ran_function_id": 2,
        "rc_ran_function_id": 3
      },
      "rdl": {
        "decision_window_ms": 200,
        "use_fake_sdl": false,
        "dispatch_raw_aper": true
      }
    }
  routes.rt: |
    newrt|start
    # Rotas de Telemetria E2SM-KPM (E2Term -> SubMgr -> RDL xApp)
    rte|12050|service-ricxapp-iqos-xapp-rdl-rmr.ricxapp:4560
    # Rotas de Subscrição E2 (RDL xApp -> SubMgr)
    rte|12020|service-ricplt-submgr-rmr.ricplt:4560
    rte|12021|service-ricxapp-iqos-xapp-rdl-rmr.ricxapp:4560
    # Rotas de Controle E2SM-RC (RDL xApp -> E2Term)
    rte|12010|service-ricplt-e2term-rmr.ricplt:38000
    rte|12011|service-ricxapp-iqos-xapp-rdl-rmr.ricxapp:4560
    rte|12012|service-ricxapp-iqos-xapp-rdl-rmr.ricxapp:4560
    # Propostas de Ações das Reference xApps para a RDL
    rte|30000|service-ricxapp-iqos-xapp-rdl-rmr.ricxapp:4560
    newrt|end
