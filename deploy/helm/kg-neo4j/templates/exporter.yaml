apiVersion: v1
kind: ConfigMap
metadata:
  name: kg-neo4j-exporter
  labels: {app.kubernetes.io/part-of: rdl-kg}
data:
  export_kg_job.py: |-
{{ .Files.Get "files/export_kg_job.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kg-neo4j-export
  labels: {app.kubernetes.io/part-of: rdl-kg}
spec:
  schedule: {{ .Values.exporter.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels: {app: kg-neo4j-export}
        spec:
          restartPolicy: Never
          containers:
            - name: export
              image: {{ .Values.exporter.image }}
              command: ["python", "/job/export_kg_job.py"]
              env:
                - name: SOURCE_URL
                  value: {{ if .Values.testSource.enabled }}"http://kg-test-source:8080"{{ else }}{{ .Values.source.url | quote }}{{ end }}
                - {name: NEO4J_HTTP, value: "http://kg-neo4j:7474"}
                - {name: NEO4J_DATABASE, value: {{ .Values.exporter.database | quote }}}
                - {name: NEO4J_USER, value: "neo4j"}
                - name: NEO4J_PASSWORD
                  valueFrom: {secretKeyRef: {name: kg-neo4j-auth, key: password}}
              resources:
                {{- toYaml .Values.exporter.resources | nindent 16 }}
              volumeMounts:
                - {name: job, mountPath: /job}
          volumes:
            - name: job
              configMap: {name: kg-neo4j-exporter}
