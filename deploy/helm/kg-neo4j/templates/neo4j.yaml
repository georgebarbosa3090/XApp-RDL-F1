{{- if .Values.neo4j.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kg-neo4j-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.neo4j.persistence.storageClass }}
  resources: {requests: {storage: {{ .Values.neo4j.persistence.size }}}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kg-neo4j
  labels: {app: kg-neo4j, app.kubernetes.io/part-of: rdl-kg}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: kg-neo4j}}
  template:
    metadata:
      labels: {app: kg-neo4j}
    spec:
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image }}
          env:
            - name: NEO4J_AUTH
              valueFrom: {secretKeyRef: {name: kg-neo4j-auth, key: NEO4J_AUTH}}
            - {name: NEO4J_server_memory_heap_initial__size, value: {{ .Values.neo4j.heapInitial | quote }}}
            - {name: NEO4J_server_memory_heap_max__size, value: {{ .Values.neo4j.heapMax | quote }}}
            - {name: NEO4J_server_memory_pagecache_size, value: {{ .Values.neo4j.pageCache | quote }}}
            - {name: NEO4J_dbms_usage__report_enabled, value: "false"}
          ports:
            - {name: http, containerPort: 7474}
            - {name: bolt, containerPort: 7687}
          readinessProbe:
            httpGet: {path: /, port: 7474}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          {{- if .Values.neo4j.persistence.enabled }}
          persistentVolumeClaim: {claimName: kg-neo4j-data}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kg-neo4j
  labels: {app.kubernetes.io/part-of: rdl-kg}
spec:
  selector: {app: kg-neo4j}
  ports:
    - {name: http, port: 7474, targetPort: 7474}
    - {name: bolt, port: 7687, targetPort: 7687}
