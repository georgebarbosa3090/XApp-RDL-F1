{{- $existing := lookup "v1" "Secret" .Release.Namespace "kg-neo4j-auth" }}
{{- $password := .Values.auth.password }}
{{- if not $password }}
{{- if $existing }}{{- $password = index $existing.data "password" | b64dec }}{{- else }}{{- $password = randAlphaNum 24 }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: kg-neo4j-auth
  labels: {app.kubernetes.io/part-of: rdl-kg}
type: Opaque
stringData:
  password: {{ $password | quote }}
  NEO4J_AUTH: {{ printf "neo4j/%s" $password | quote }}
