apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xapp-energy-saving.fullname" . }}
  labels:
    {{- include "xapp-energy-saving.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "xapp-energy-saving.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "xapp-energy-saving.fullname" . }}
        # xApp proponente: a NetworkPolicy da RDL (deploy/helm/ric-governance) só aceita RMR destas
        rdl.governance/proposer: "true"
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: energy-saving
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RDL_TRANSPORT          # propostas por RMR 30000, resultado por 30001
              value: "{{ .Values.env.rdlTransport | default "rmr" }}"
            - name: XAPP_ROLE
              value: "{{ .Values.env.xappRole }}"
            - name: HTTP_PORT
              value: "{{ .Values.env.httpPort }}"
            - name: METRICS_PORT
              value: "{{ .Values.env.metricsPort }}"
            - name: RMR_PORT
              value: "{{ .Values.env.rmrPort }}"
          ports:
            - name: http-health
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: http-metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: rmr-data
              containerPort: {{ .Values.service.rmrPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
