apiVersion: v1
kind: Service
metadata:
  name: {{ include "xapp-energy-saving.fullname" . }}-http
  labels:
    {{- include "xapp-energy-saving.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "xapp-energy-saving.fullname" . }}
  ports:
    - name: http-health
      port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.service.httpPort }}
    - name: http-metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsPort }}
