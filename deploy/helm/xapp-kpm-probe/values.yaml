# xApp kpm-probe: assina E2SM-KPM v3.00 em cada nó E2 que se conecta ao RIC e registra,
# em JSON Lines, a subscrição (REST do SubMgr), as notificações e cada RIC Indication
# recebida por RMR (tipo, subscription id, tamanho e sha256 do payload).
# Sem Docker: o pod parte de uma imagem Python oficial e instala o resto no volume.

image: python:3.10-slim-bookworm   # protobuf < 3.21 (dependência do ricxappframe) não tem wheel para 3.12

pins:
  rmr:
    version: 4.9.4
    url: https://packagecloud.io/o-ran-sc/release/packages/debian/stretch/rmr_4.9.4_amd64.deb/download.deb
    sha256: 76b48a28fc7b3fe38b1f3784e2ef958bd85265613b4793f8ec2c6b09bd10f84a
  python:
    ricxappframe: "3.2.2"
    asn1tools: "0.169.0"
  # ASN.1 do E2SM usado pelo NORI, baixado no commit fixado e conferido por sha256
  noriAsn:
    baseUrl: https://raw.githubusercontent.com/lasseufpa/nori/8a30867c8105d328aa50a7daaab3bcb2b4603763/asn/v03
    files:
      e2sm-v03.01.asn: 2e3a0ec42bafec8a8084ada1e92a968004cfa199d2ec86d8356f0ee42a2b202e
      e2sm-kpm-v03.00.asn: 9f13a077601f701685296fb777d57891d0c9691af3711b6b234fdef135fd84b6
      e2sm-rc-v03.01.asn: ec0a8d603301854199ce86e85d7c19576aa82d3757540ee1bdec9e6b003f211b

ric:
  e2mgrUrl: http://service-ricplt-e2mgr-http.ricplt:3800
  submgrUrl: http://service-ricplt-submgr-http.ricplt:8088   # API REST de subscrição (8080 só tem health)
  appmgrUrl: http://service-ricplt-appmgr-http.ricplt:8080

kpm:
  ranFunctionId: 200          # RAN function KPM do NORI (OID 1.3.6.1.4.1.53148.1.3.2.2)
  reportStyle: 1              # "E2 Node Measurement", Action Format 1
  reportingPeriodMs: 1000
  granularityPeriodMs: 1000
  measNames:                  # anunciadas pelo NORI no estilo 1 (kpm-function-description.cc)
    - RRU.PrbUsedDl
    - RRU.PrbAvailDl
    - RRU.PrbTotDl
    - DRB.MeanActiveUeDl
    - RRC.ConnMean

storage:
  size: 1Gi
  storageClassName: local-path

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
