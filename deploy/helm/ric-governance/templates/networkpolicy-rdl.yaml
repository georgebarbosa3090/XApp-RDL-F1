{{- if .Values.rdlPolicy.enabled }}
# A porta RMR de dados da RDL só recebe da plataforma (Indications, ACKs, A1) e das xApps proponentes
# rotuladas; a origem RMR declarada na mensagem é conferida depois pelo registro de xApps da RDL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rdl-rmr-data-proposers-only
  namespace: {{ .Values.ricxapp.namespace }}
  labels: {app.kubernetes.io/part-of: rdl-governance}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.ricxapp.rdl.podLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.ricplt.namespace }}}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.ricxapp.rdl.proposerLabel | nindent 14 }}
      ports:
        - {port: {{ .Values.ricxapp.rdl.rmrDataPort }}, protocol: TCP}
    # Rota RMR (4561): só o RtMgr, no namespace da plataforma
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.ricplt.namespace }}}
      ports:
        - {port: 4561, protocol: TCP}
    {{- if .Values.rdlPolicy.restrictHttp }}
    # HTTP (8080: /health, /ready, /governance, /rejections, /decisions, /kg) e métricas (8081): só os
    # namespaces que consomem esses endpoints (rApps e CronJob do grafo no Non-RT RIC, observabilidade).
    # As sondas do kubelet vêm do próprio nó, que o controlador do k3s (kube-router) sempre permite.
    - from:
        {{- range .Values.rdlPolicy.httpAllowedNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . }}}
        {{- end }}
      ports:
        - {port: 8080, protocol: TCP}
        - {port: 8081, protocol: TCP}
    {{- else }}
    # HTTP e métricas sem restrição (rdlPolicy.restrictHttp=false)
    - ports:
        - {port: 8080, protocol: TCP}
        - {port: 8081, protocol: TCP}
    {{- end }}
{{- end }}
