apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iqos-xapp-rdl.fullname" . }}
  labels:
    {{- include "iqos-xapp-rdl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "iqos-xapp-rdl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "iqos-xapp-rdl.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: USE_FAKE_SDL
              value: {{ .Values.env.useFakeSdl | quote }}
            - name: RMR_SEED_RT
              value: {{ .Values.env.rmrSeedRt | quote }}
            - name: CONFIG_FILE
              value: {{ .Values.env.configFile | quote }}
            - name: RMR_WAIT_FOR_READY
              value: {{ .Values.env.rmrWaitForReady | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
          ports:
            - name: rmr-data
              containerPort: {{ .Values.service.rmr.dataPort }}
              protocol: TCP
            - name: rmr-route
              containerPort: {{ .Values.service.rmr.routePort }}
              protocol: TCP
            - name: http-health
              containerPort: {{ .Values.service.http.port }}
              protocol: TCP
            - name: http-metrics
              containerPort: {{ .Values.service.metrics.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
