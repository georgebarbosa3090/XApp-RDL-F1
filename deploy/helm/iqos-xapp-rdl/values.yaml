replicaCount: 1

image:
  repository: iqos-xapp-rdl
  pullPolicy: IfNotPresent
  tag: "1.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "ricxapp-iqos-xapp-rdl"

serviceAccount:
  create: false
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  useFakeSdl: "false"
  rmrSeedRt: "/app/configs/routes.rt"
  configFile: "/app/configs/config-file.json"
  rmrWaitForReady: "true"
  logLevel: "INFO"

service:
  http:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  metrics:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  rmr:
    type: ClusterIP
    dataPort: 4560
    routePort: 4561

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
