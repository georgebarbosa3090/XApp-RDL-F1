replicaCount: 1

image:
  repository: iqos-xapp-rdl
  pullPolicy: IfNotPresent
  tag: "1.1.0"
  # Opcional: digest (sha256:...) da imagem; quando definido, a imagem é referenciada por ele, não pela tag
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "ricxapp-iqos-xapp-rdl"

serviceAccount:
  create: false
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Única área gravável do contêiner (raiz somente leitura): /tmp, num emptyDir. O cache do ASN.1 do
# codec E2SM v3 vai para lá (XAPP_RDL_ASN1_DIR).
tmpVolume:
  sizeLimit: 256Mi

env:
  # Modos aceitos: governance (RMR real, fora do modo estrito), o_ran_interop (estrito) e
  # offline_simulation (RMR simulado: não envia nem recebe nada; só para testes). Um valor
  # desconhecido derruba a xApp na partida (src/rdl_xapp.py, parse_rdl_mode).
  rdlMode: "governance"
  # Nó E2 assinado pela RDL no ponto de entrada
  e2Node: "gnb_01"
  ranBackend: "NORI_NS3"
  useFakeSdl: "false"
  rmrSeedRt: "/app/configs/routes.rt"
  configFile: "/app/configs/config-file.json"
  rmrWaitForReady: "false"
  logLevel: "INFO"

service:
  http:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  metrics:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  rmr:
    type: ClusterIP
    dataPort: 4560
    routePort: 4561

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
