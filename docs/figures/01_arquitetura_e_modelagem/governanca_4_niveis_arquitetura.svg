<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 570" role="img">
<title>Arquitetura da governança hierárquica das xApps</title>
<desc>SMO e Non-RT RIC no topo com rApp de governança, A1-PMS e Neo4j; Near-RT RIC com xApps próprias, xApp de terceiros e a RDL; barreira de NetworkPolicy em volta do E2Term; RAN embaixo, com KPM voltando à RDL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:#3d3d3a}.ts{font-size:12px;font-weight:400;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#2c2c2a}
.box{fill:#f8f7f3;stroke:#888780}.arr{stroke:#5f5e5a;stroke-width:1.2;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style><rect x="0" y="0" width="680" height="570" fill="#ffffff"/>
<g class="c-purple">
<rect x="40" y="30" width="600" height="110" rx="16" stroke-width="0.5"/>
<text class="th" x="60" y="48" dominant-baseline="central">SMO / Non-RT RIC · nível 4</text>
</g>
<g>
<rect class="box" x="60" y="66" width="176" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="148" y="86" text-anchor="middle" dominant-baseline="central">Neo4j</text>
<text class="ts" x="148" y="106" text-anchor="middle" dominant-baseline="central">histórico do grafo</text>
</g>
<g>
<rect class="box" x="252" y="66" width="176" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="86" text-anchor="middle" dominant-baseline="central">rApp de governança</text>
<text class="ts" x="340" y="106" text-anchor="middle" dominant-baseline="central">quarentena, teto</text>
</g>
<g>
<rect class="box" x="444" y="66" width="176" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="532" y="86" text-anchor="middle" dominant-baseline="central">A1-PMS</text>
<text class="ts" x="532" y="106" text-anchor="middle" dominant-baseline="central">política A1 20000</text>
</g>
<g class="c-teal">
<rect x="40" y="172" width="600" height="146" rx="16" stroke-width="0.5"/>
<text class="th" x="60" y="190" dominant-baseline="central">Near-RT RIC · níveis 2 e 3</text>
</g>
<g>
<rect class="box" x="60" y="212" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="232" text-anchor="middle" dominant-baseline="central">xApps próprias</text>
<text class="ts" x="135" y="252" text-anchor="middle" dominant-baseline="central">RMR 30000</text>
</g>
<g>
<rect class="box" x="226" y="212" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="301" y="232" text-anchor="middle" dominant-baseline="central">xApp terceiros</text>
<text class="ts" x="301" y="252" text-anchor="middle" dominant-baseline="central">12040 interceptado</text>
</g>
<g>
<rect class="box" x="392" y="212" width="228" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="506" y="230" text-anchor="middle" dominant-baseline="central">RDL</text>
<text class="ts" x="506" y="250" text-anchor="middle" dominant-baseline="central">registro, janela, decisão</text>
<text class="ts" x="506" y="268" text-anchor="middle" dominant-baseline="central">conflito implícito (KPM)</text>
</g>
<path d="M135 268 L135 302 L440 302 L440 290" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="301" y1="268" x2="301" y2="302" class="arr"/>
<line x1="430" y1="210" x2="402" y2="126" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="158" dominant-baseline="central">GET /governance</text>
<line x1="560" y1="124" x2="560" y2="208" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="570" y="158" dominant-baseline="central">A1 20000</text>
<line x1="258" y1="270" x2="258" y2="346" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="266" y="334" dominant-baseline="central">direto: bloqueado</text>
<g class="c-coral">
<rect x="200" y="350" width="280" height="100" rx="12" stroke-width="0.5" stroke-dasharray="5 3"/>
<text class="th" x="340" y="368" text-anchor="middle" dominant-baseline="central">Nível 1 · NetworkPolicy e rotas</text>
</g>
<g>
<rect class="box" x="250" y="384" width="180" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="402" text-anchor="middle" dominant-baseline="central">E2Term</text>
<text class="ts" x="340" y="422" text-anchor="middle" dominant-baseline="central">38000 só da RDL</text>
</g>
<path d="M580 290 L580 410 L434 410" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="490" y="396" dominant-baseline="central">RIC Control</text>
<line x1="340" y1="436" x2="340" y2="478" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="200" y="482" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="502" text-anchor="middle" dominant-baseline="central">RAN · nós E2</text>
<text class="ts" x="340" y="522" text-anchor="middle" dominant-baseline="central">gNB, DU/CU, NORI</text>
</g>
<path d="M480 510 L612 510 L612 292" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="618" y="400" dominant-baseline="central">KPM</text>
</svg>

