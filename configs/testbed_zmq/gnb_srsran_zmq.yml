# =============================================================================
# srsRAN Project gNodeB Configuration - ZeroMQ Virtual RF Mode
# Arquivo: configs/testbed_zmq/gnb_srsran_zmq.yml
# =============================================================================

cu_cp:
  amf:
    addr: 127.0.0.5
    bind_addr: 127.0.0.1
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "99970"
            tai_slice_support_list:
              - sst: 1
                sd: 0x000001
              - sst: 2
                sd: 0x000002

# Conexão O-RAN Near-RT RIC via E2 Agent Nativo
e2:
  enable_e2: true
  e2t_ip: 127.0.0.1
  e2t_port: 36422
  e2node_id: 0x192
  plmn: "99970"
  kpm_report_period_ms: 200

ru_sdr:
  device_driver: zmq
  device_args: "tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6"
  srate: 23.04
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 627340
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "99970"
  tac: 1
  pci: 1
  nof_antennas_dl: 1
  nof_antennas_ul: 1

qos:
  five_qi_config:
    - 5qi: 9
      priority: 90
    - 5qi: 82
      priority: 10
      packet_delay_budget_ms: 10
