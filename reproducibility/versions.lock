[o-ran-specs]
e2ap = "v02.03"
e2sm_kpm = "v03.00"
e2sm_rc = "v01.03"
near_rt_ric_arch = "v17.00"

# Revisão 2026-11-07: o commit NORI "9b64c12" fixado anteriormente não existe em
# github.com/lasseufpa/nori, e o NORI não roda em ns-3.48 / 5G-LENA v5.1. O perfil
# abaixo reproduz os commits fixados pelo Dockerfile oficial do NORI. Execuções
# anteriores que declaram "9b64c12" não correspondem a nenhuma versão real do NORI.
[profile.nori]
backend = "NORI_NS3"
ns3 = "3.42"
ns3_commit = "ab4cce021d8f6b2458784704a10af810d3969f0f"
nr_commit = "78b7179e3841c608c2021ffa88bea1906a1c7594"
nori_commit = "8a30867c8105d328aa50a7daaab3bcb2b4603763"
e2sim_commit = "da6f82f286cdbb38af1178f82f85877b12c2f85b"
asn1c_commit = "8b8028a80aa8f5545dfcaa9d357150ac0c475f70"
e2ap = "v03.01"
e2sm_kpm = "v03.00"
e2sm_rc = "v03.01"
oran_sc_release = "I"
deployment = "helm: deploy/helm/nori-ns3"
# Patches do projeto aceitos sobre o NORI (arquivo:sha256, separados por vírgula). Execuções sem
# patch (NORI intacto) também conferem; um patch fora desta lista reprova R6.
#   0001-rc-control-ack.patch: o NORI 8a30867 aplica o RIC Control E2SM-RC mas não envia
#   RICcontrolAcknowledge (só a CCC envia); o patch o envia quando o Control traz cotas de PRB.
nori_patches = "0001-rc-control-ack.patch:94a1d0911eb276ec279eb878fd8d0ab8a6d46af68a4a44973a7ade6e1516e3eb"

