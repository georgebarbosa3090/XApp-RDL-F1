[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xapp-rdl-f1"
version = "1.1.0"
description = "O-RAN Near-RT RIC Conflict Mitigation xApp — Phase 1: Deterministic H-RDL"
authors = [{ name = "George Barbosa", email = "george.barbosa@icen.ufpa.br" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
    "prometheus-client>=0.17.0",
    "pycrate>=0.5.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.scripts]
xapp-rdl = "src.main:main"
