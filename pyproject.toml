[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xapp-rdl-f1"
version = "1.1.0"
description = "O-RAN Near-RT RIC Conflict Mitigation xApp — Phase 1: Deterministic H-RDL"
authors = [{ name = "George Barbosa", email = "george.barbosa@icen.ufpa.br" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "structlog>=23.1.0",
    "prometheus-client>=0.19.0",
    "pycrate>=0.7.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]

[project.scripts]
xapp-rdl = "src.main:main"

[project.optional-dependencies]
oran = ["ricxappframe>=3.2.2"]
test = [
    "httpx2",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "PyYAML>=6.0.1",
    "ruff>=0.2.0"
]

[tool.pyright]
extraPaths = ["."]
