name: CI-Software - RDL xApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  software-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        

    - name: Install RMR C Libraries
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends curl dpkg gcc python3-dev
        curl -fLsS https://packagecloud.io/o-ran-sc/release/packages/debian/stretch/rmr_4.9.0_amd64.deb/download.deb -o rmr_4.9.0_amd64.deb
        sudo dpkg -i --force-depends rmr_4.9.0_amd64.deb || sudo apt-get install -f -y
        curl -fLsS https://packagecloud.io/o-ran-sc/release/packages/debian/stretch/rmr-dev_4.9.0_amd64.deb/download.deb -o rmr-dev_4.9.0_amd64.deb
        sudo dpkg -i --force-depends rmr-dev_4.9.0_amd64.deb || sudo apt-get install -f -y
        sudo ldconfig
        ldconfig -p | grep -i rmr
        rm -f rmr_4.9.0_amd64.deb rmr-dev_4.9.0_amd64.deb
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt -r requirements-dev.txt
        
    - name: Syntax & Smoke Import Check
      run: |
        python -m compileall -q src scripts
        python -c "from src.rdl_xapp import RDLxApp; print('[OK] Smoke Import Clean')"

    - name: Run Codec & Golden Vector tests

      run: |
        pytest tests/codec/ -v
        
    - name: Run Unit & Negative tests
      run: |
        pytest tests/unit/ -v

    - name: Run Integration tests
      run: |
        pytest tests/integration/ -v

    - name: Run Interoperability tests
      run: |
        pytest tests/interoperability/ -v

    - name: Run Zero-Synthetic Audit
      run: |
        python scripts/check_no_synthetic_results.py

    - name: Output Software Status
      run: |
        echo "=== SOFTWARE PASS ==="

  docker-build:
    needs: software-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t iqos-xapp-rdl:1.1.0 -f docker/Dockerfile .


