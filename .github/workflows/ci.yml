name: CI-Software - RDL xApp

# Roda em todo push (inclusive nos ramos de trabalho, como malha-fechada) e nos PRs para a main.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Ruff (erros de sintaxe e nomes indefinidos)
      run: |
        python -m pip install --upgrade pip
        pip install "ruff>=0.2.0"
        ruff check --select E9,F63,F7,F82 src scripts tests reference-xapps rapps

  helm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
      with:
        version: v3.14.4
    - name: helm lint e helm template de todos os charts
      run: |
        set -euo pipefail
        for chart in deploy/helm/*/; do
          [ -f "${chart}Chart.yaml" ] || continue
          extra=()
          # A kpm-probe recebe o src/ de um commit por scripts/deploy_kpm_probe.sh: aqui, valores fictícios
          if [ "$(basename "$chart")" = "xapp-kpm-probe" ]; then extra=(--set srcBundle=ci --set srcCommit=0000000); fi
          echo "== ${chart}"
          helm lint "$chart" "${extra[@]}"
          helm template ci "$chart" "${extra[@]}" > /dev/null
        done

  software-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      USE_FAKE_SDL: "True"
      RDL_MODE: OFFLINE_SIMULATION
      RAN_BACKEND: NORI_NS3
      LD_LIBRARY_PATH: "/usr/local/lib:/usr/lib"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Falha fechada: sem a biblioteca RMR o job para aqui, em vez de seguir em silêncio sem ela.
    - name: Install RMR C Libraries
      run: |
        set -euo pipefail
        base=https://packagecloud.io/o-ran-sc/release/packages/debian/stretch
        curl -fsSL "$base/rmr_4.9.0_amd64.deb/download.deb" -o rmr_4.9.0_amd64.deb
        curl -fsSL "$base/rmr-dev_4.9.0_amd64.deb/download.deb" -o rmr-dev_4.9.0_amd64.deb
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ./rmr_4.9.0_amd64.deb ./rmr-dev_4.9.0_amd64.deb
        sudo ldconfig
        ldconfig -p | grep -q librmr_si
        rm -f ./*.deb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install ".[test,oran]"
        pip install pytest pytest-cov pytest-env pyyaml pyright pytest-timeout

    - name: Syntax & Smoke Import Check
      run: |
        python -m compileall -q src scripts
        python -c "from src.rdl_xapp import RDLxApp; print('[OK] Smoke Import Clean')"

    - name: Run Pyright Static Audit
      run: |
        python scripts/run_pyright_check.py

    - name: Run Zero-Synthetic Audit
      run: |
        python scripts/check_no_synthetic_results.py

    # Uma única execução da suíte (codec, unit, integration, interoperability) com cobertura
    - name: Run Full Test Suite with Coverage
      run: |
        pytest tests/ --cov=src --cov-config=.coveragerc --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85 -q --timeout=120
        python scripts/verify_coverage.py coverage.xml 85.0

  docker-build:
    needs: [lint, helm, software-test]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t iqos-xapp-rdl:1.1.0 -f docker/Dockerfile .
