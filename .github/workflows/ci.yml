name: CI - RDL xApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        
    - name: Run Codec & Golden Vector tests
      run: |
        pytest tests/codec/ -v
        
    - name: Run Unit & Negative tests
      run: |
        pytest tests/unit/ -v

    - name: Run Integration tests
      run: |
        pytest tests/integration/ -v

    - name: Run Interoperability tests
      run: |
        pytest tests/interoperability/ -v

    - name: Run Zero-Synthetic & Scientific Compliance Audits
      run: |
        python scripts/check_no_synthetic_results.py
        python scripts/verify_provenance_and_integrity.py
        python scripts/validate_experiment_tree.py --check-gate1 || true

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t iqos-xapp-rdl:1.1.0 -f docker/Dockerfile .

